version: '3.8'

services:
  # 1. FastAPI AI Intelligence Backend
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: kinetic-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - GROQ_API_KEY=${GROQ_API_KEY}
      - PORT=8000
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - kinetic-network

  # 2. Next.js 16 Edge Frontend
  frontend:
    build:
      context: ./web
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:8000}
        - GROQ_API_KEY=${GROQ_API_KEY}
    container_name: kinetic-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://backend:8000
      - GROQ_API_KEY=${GROQ_API_KEY}
    depends_on:
      - backend
    networks:
      - kinetic-network

networks:
  kinetic-network:
    driver: bridge
